# Full replacement for /etc/nginx/nginx.conf (not a conf.d snippet) so
# behavior doesn't depend on whatever default the base image's nginx
# package ships — see docker/entrypoint.sh for how dist/ stays fresh.
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
  gzip_min_length 512;

  server {
    listen 80;
    server_name _;
    root /app/dist;
    index index.html;

    # Astro's static build content-hashes everything under /_astro/, so
    # it's safe to cache those assets forever — a price sync + rebuild
    # produces new filenames, not new content at an old URL.
    location /_astro/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML/data pages change on every price sync — never cache them.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
  }
}
